name: hotel_checkin
description: Hotel self check-in mobile app & admin web panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  uuid: ^4.2.1
  sqflite: ^2.3.0
  path_provider: ^2.1.5
  sqflite_common_ffi_web: ^0.4.3
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.5.0
  collection: ^1.18.0
  go_router: ^14.6.1
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.2
  http: ^1.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
