name: hotel_checkin
description: Hotel self check-in mobile app & admin web panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  uuid: ^4.2.1
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.5.0
  collection: ^1.18.0
  go_router: ^14.6.1
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.2
  http: ^1.2.0
  web: ^1.1.1
  get_it: ^9.2.1
  crypto: ^3.0.3

  # ── Staff mobile app (lib/main_mobile.dart) ────────────────────────────────
  # Only reachable from the mobile entry point; the web build never imports
  # these. Each supports web as a no-op or stub, so adding them cannot break
  # `flutter build web`.
  # Pinned to v10, not v9 or v11, and both bounds matter:
  #   * v9's web implementation uses dart:html, which fails the wasm dry run on
  #     `flutter build web` even though no web code imports it — the plugin
  #     registrant pulls in every declared platform implementation regardless.
  #     v10 moved to package:web.
  #   * v11 requires win32 ^6, which conflicts with file_picker ^8 (win32 ^5).
  #     file_picker is used by two working web screens, so it is not moving.
  flutter_secure_storage: ^10.3.2  # session tokens in the platform keystore
  connectivity_plus: ^6.1.0        # offline banner + write failure messaging
  local_auth: ^3.0.2               # biometric re-unlock on shared devices
  # Offline layer (F-05). hive_ce rather than the unmaintained `hive`, and in
  # preference to drift: the cached data is small reference material and an
  # ordered outbox, so a key-value store fits without pulling in build_runner
  # codegen. Verified not to disturb `flutter build web` or its wasm dry run.
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6           # where the Hive boxes live on device
  flutter_local_notifications: ^22.3.1
  wakelock_plus: ^1.5.2
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800

    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400
